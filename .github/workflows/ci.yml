name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    name: build and unit tests (${{ matrix.cc }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset ci -DCMAKE_C_COMPILER=${{ matrix.cc }}

      - name: Build
        run: cmake --build --preset ci

      - name: Unit tests
        run: ctest --preset ci

  netns:
    name: netns tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default

      - name: netns tests
        run: ctest --preset netns

  sanitize:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Configure
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan

      - name: Unit tests
        run: ctest --preset asan

      - name: netns tests
        run: ctest --preset netns-asan

  cross:
    name: cross build (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            gcc: aarch64-linux-gnu-gcc
            packages: gcc-aarch64-linux-gnu
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build ${{ matrix.packages }}

      - name: Configure
        run: cmake --preset ci -DCMAKE_C_COMPILER=${{ matrix.gcc }}

      - name: Build
        run: cmake --build --preset ci

  static-analysis:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install clang-tidy
        run: pip install clang-tidy==22.1.8

      - name: Configure
        run: >-
          cmake -S . -B build-tidy -G Ninja
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DOMCPROXY_FUZZ=ON
          -DOMCPROXY_WERROR=OFF

      - name: Check static analysis
        run: run-clang-tidy.py -p build-tidy -quiet

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install clang-format
        run: pip install clang-format==22.1.8

      - name: Check formatting
        run: git ls-files -z '*.c' '*.h' | xargs -0 clang-format --dry-run -Werror
